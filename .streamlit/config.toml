# Revelatio app configuration. Dark navy ground with one indigo accent, matching
# the CSS tokens at the top of streamlit_app.py, so Streamlit's own widgets
# (tables, tabs, sliders, inputs) read as part of the same product.

[theme]
base = "dark"
primaryColor = "#5B6CF0"            # indigo - the single accent
backgroundColor = "#07071F"         # deep navy
secondaryBackgroundColor = "#10102E"  # panels, inputs, table headers
textColor = "#F5F6FA"               # off-white
# Poppins everywhere, including Streamlit's canvas-drawn tables and widgets.
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap, sans-serif"
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap, sans-serif"
baseFontWeight = 400
headingFontWeights = 600

[server]
# The deployed app reads precomputed artifacts from results/; it never scores
# sentiment or runs a backtest at runtime.
headless = true
